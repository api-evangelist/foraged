aid: foraged
name: Foraged
description: 'Foraged is a community marketplace for wild and specialty foods, connecting independent
  foragers, farmers, fishers, and artisan food producers directly with home cooks and professional
  chefs across the United States. Founded in 2021 and built on a custom Medusa commerce stack, Foraged
  provides an end-to-end platform covering vendor storefronts, product listings, shipping logistics,
  and secure payment processing for hard-to-source ingredients like wild mushrooms, truffles, foraged
  berries, sea vegetables, and other specialty foods. Sellers manage their entire shop from a vendor
  dashboard while buyers discover seasonal wild foods through the marketplace website and mobile app.
  Backed by Bessemer Venture Partners. This profile was surfaced as a portfolio-company lead and
  enriched by the API Evangelist pipeline; Foraged publishes no public developer API.'
